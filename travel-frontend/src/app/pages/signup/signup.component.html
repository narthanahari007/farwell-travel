
<section class="auth-page"><div class="auth-card">
  <a routerLink="/" class="back-link">← Farwell home</a>
  <h1>Create your Farwell account</h1>
  <p>Save your trips and complete bookings in one place.</p>
  <form (ngSubmit)="submit()">
    <label>Full name<input type="text" name="name" [(ngModel)]="name" required></label>
    <label>Email<input type="email" name="email" [(ngModel)]="email" required></label>
    <label>Password<input type="password" name="password" [(ngModel)]="password" required minlength="6"></label>
    <div class="form-error" *ngIf="error()">{{ error() }}</div>
    <button class="btn btn-primary full" type="submit" [disabled]="submitting()">{{ submitting() ? 'Creating…' : 'Sign up free' }}</button>
  </form>
  <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
</div></section>
